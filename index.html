<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agile & DevOps Tools Hub</title>
  <!-- Tailwind CSS + Font Awesome + Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); }
    .filter-chip-active { background-color: #3b82f6; color: white; }
    .filter-chip-inactive { background-color: #f1f5f9; color: #1e293b; }
    .dark .filter-chip-inactive { background-color: #334155; color: #e2e8f0; }
    .heart-active { color: #ef4444; }
    .heart-inactive { color: #94a3b8; }
    .dark .heart-inactive { color: #64748b; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

  <!-- NAVIGATION -->
  <nav class="sticky top-0 z-30 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-2">
          <i class="fas fa-code-branch text-blue-600 dark:text-blue-400 text-2xl"></i>
          <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">DevOps Hub</span>
        </div>
        <div class="flex items-center gap-3 sm:gap-5">
          <button id="homeNavBtn" class="text-gray-700 dark:text-gray-200 hover:text-blue-600 transition"><i class="fas fa-home"></i><span class="hidden sm:inline ml-1"> Home</span></button>
          <button id="favoritesNavBtn" class="text-gray-700 dark:text-gray-200 hover:text-red-500 transition"><i class="fas fa-heart"></i><span class="hidden sm:inline ml-1"> Favorites</span></button>
          <button id="darkModeToggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700"><i id="darkIcon" class="fas fa-moon"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- LIST VIEW -->
    <div id="listView">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <h1 class="text-2xl md:text-3xl font-bold"><i class="fas fa-toolbox text-blue-500 mr-2"></i>Agile & DevOps Tools</h1>
        <span class="text-sm bg-gray-200 dark:bg-gray-700 rounded-full px-3 py-1"><span id="resultCount">0</span> tools</span>
      </div>
      <div class="flex flex-col md:flex-row gap-4 mb-6">
        <div class="relative flex-1">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="Search by tool name..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button id="clearFiltersBtn" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition"><i class="fas fa-eraser"></i> Clear</button>
      </div>
      <div id="categoryFiltersContainer" class="flex flex-wrap gap-2 mb-8"></div>
      <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 fade-in"></div>
      <div id="noResultsMsg" class="text-center py-12 hidden"><i class="fas fa-search text-5xl text-gray-400 mb-3"></i><p>No tools match your criteria.</p></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" class="hidden fade-in">
      <button id="backToListBtn" class="mb-6 inline-flex items-center gap-2 px-5 py-2.5 bg-gray-200 dark:bg-gray-700 rounded-xl hover:bg-gray-300 dark:hover:bg-gray-600 transition"><i class="fas fa-arrow-left"></i> Back to Tools</button>
      <div id="detailContent" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 md:p-8"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
